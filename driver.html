<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Sentinela-7 · Motorista</title>
<link rel="manifest" href="driver-manifest.json">
<style>
:root{--neon:#00f0ff;--gold:#ffb300;--bg:#02060b;--danger:#ff2d55;--ok:#00ff9d;
--line:rgba(0,240,255,.22);--text:#dffcff;--muted:rgba(0,240,255,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 20%,rgba(0,240,255,.12),
rgba(2,6,11,.98) 60%),var(--bg);color:var(--text);
font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:100vh;
overflow-y:auto;padding:16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px);
opacity:.3}
.wrap{min-height:calc(100vh - 32px);display:flex;align-items:center;
justify-content:center;position:relative;z-index:1}
.card{width:min(440px,100%);border:1px solid var(--neon);
background:linear-gradient(180deg,rgba(0,240,255,.07),rgba(2,6,11,.98));
padding:24px 22px;margin:auto}
.card .logo{width:64px;height:64px;margin:0 auto 12px;color:var(--neon);
filter:drop-shadow(0 0 12px var(--neon));display:block}
.card h1{font-size:18px;letter-spacing:.22em;text-align:center;font-weight:800;
text-shadow:0 0 12px var(--neon);margin-bottom:4px}
.card h1 span{color:var(--gold);text-shadow:0 0 12px var(--gold)}
.card .sub{text-align:center;font-size:9px;color:var(--muted);
letter-spacing:.24em;margin-bottom:20px}
label{display:block;font-size:9px;color:var(--muted);letter-spacing:.2em;
margin-bottom:5px}
input[type=text]{width:100%;padding:12px;font-family:inherit;font-size:14px;
background:rgba(0,240,255,.05);border:1px solid var(--line);color:var(--text);
outline:none;text-align:center;letter-spacing:.1em;margin-bottom:12px}
input[type=text]:focus{border-color:var(--neon);
box-shadow:0 0 12px rgba(0,240,255,.25)}
input.code{letter-spacing:.4em;font-size:18px;text-transform:uppercase;
font-weight:700}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px;
margin:14px 0;border:1px solid rgba(255,179,0,.35);
background:rgba(255,179,0,.05);cursor:pointer}
.consent input{margin-top:2px;accent-color:var(--ok);flex:0 0 auto;
width:16px;height:16px}
.consent span{font-size:9.5px;line-height:1.6;color:#ffe6b3}
button.start{width:100%;padding:13px;margin-top:8px;border:1px solid var(--ok);
background:rgba(0,255,157,.1);color:var(--ok);font-family:inherit;font-size:11px;
font-weight:700;letter-spacing:.14em;cursor:pointer;transition:.2s}
button.start:hover:not(:disabled){background:rgba(0,255,157,.22)}
button.start:disabled{opacity:.35;cursor:not-allowed}
button.stop{width:100%;padding:13px;margin-top:16px;border:1px solid var(--danger);
background:rgba(255,45,85,.1);color:var(--danger);font-family:inherit;
font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer}
.status-live{display:flex;align-items:center;gap:8px;justify-content:center;
padding:12px;border:1px solid var(--ok);background:rgba(0,255,157,.06);
color:#c9ffe7;font-size:11px;letter-spacing:.1em;margin:16px 0}
.status-live .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);
box-shadow:0 0 12px var(--ok);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.info-box{border:1px solid var(--line);background:rgba(0,240,255,.03);
padding:10px 12px;font-size:9.5px;color:var(--muted);line-height:1.7;
margin-bottom:12px}
.info-box b{color:var(--text)}
.chat{max-height:180px;overflow-y:auto;border:1px solid var(--line);padding:8px;
background:rgba(0,0,0,.25);font-size:10px;line-height:1.5;margin-bottom:8px}
.chat .msg{margin-bottom:6px;padding:6px 9px;max-width:85%;word-break:break-word}
.chat .msg.me{background:rgba(0,240,255,.1);border-left:2px solid var(--neon);
margin-left:auto;text-align:right}
.chat .msg.them{background:rgba(255,179,0,.08);border-left:2px solid var(--gold)}
.chat .msg .meta{font-size:7.5px;color:var(--muted);margin-top:2px}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;padding:9px;font-family:inherit;font-size:10px;
background:rgba(0,240,255,.05);border:1px solid var(--line);color:var(--text);
outline:none;text-align:left;letter-spacing:0;margin-bottom:0;font-size:10px}
.chat-input button{padding:9px 14px;font-family:inherit;font-size:9.5px;
border:1px solid var(--neon);background:rgba(0,240,255,.1);color:var(--neon);
cursor:pointer}
.hidden{display:none!important}
#toastWrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
z-index:9995;display:flex;flex-direction:column;gap:6px;align-items:center;
pointer-events:none;width:min(92vw,420px)}
.toast{width:100%;padding:9px 12px;border:1px solid var(--gold);
background:rgba(2,6,11,.96);font-size:10px;color:#ffe6b3;backdrop-filter:blur(6px)}
.toast.ok{border-color:var(--ok);color:#c9ffe7}
.toast.danger{border-color:var(--danger);color:#ffd0dc}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg class="logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.4">
      <path d="M50 7C24 7 12 29 12 48c0 24 17 45 38 45s38-21 38-45C88 29 76 7 50 7Z"/>
      <ellipse cx="33" cy="47" rx="11" ry="7.5" transform="rotate(-22 33 47)" fill="currentColor"/>
      <ellipse cx="67" cy="47" rx="11" ry="7.5" transform="rotate(22 67 47)" fill="currentColor"/>
    </svg>
    <h1>SENTINELA<span>-7</span></h1>
    <p class="sub">MODO MOTORISTA</p>

    <div id="formView">
      <label>CÓDIGO DA CENTRAL</label>
      <input type="text" class="code" id="dvCode" maxlength="6" placeholder="ABC123">

      <label>SEU NOME</label>
      <input type="text" id="dvName" maxlength="24" placeholder="Ex: João Silva">

      <label class="consent">
        <input type="checkbox" id="dvConsent">
        <span>Autorizo compartilhar minha <b>localização GPS</b> com a central enquanto este app estiver ativo. Sei que posso parar a qualquer momento e que nenhuma câmera ou microfone é acessado.</span>
      </label>

      <button class="start" id="dvStart" disabled>◈ INICIAR COMPARTILHAMENTO</button>
    </div>

    <div id="activeView" class="hidden">
      <div class="status-live"><span class="dot"></span>TRANSMITINDO PARA A CENTRAL</div>
      <div class="info-box">
        <b>Código:</b> <span id="dvActiveCode">—</span><br>
        <b>Nome:</b> <span id="dvActiveName">—</span><br>
        <b>Posições enviadas:</b> <span id="dvCount">0</span><br>
        <b>Última:</b> <span id="dvLast">—</span>
      </div>
      <div style="font-size:9.5px;color:var(--gold);letter-spacing:.14em;margin-bottom:6px">◈ MENSAGENS DA CENTRAL</div>
      <div class="chat" id="dvChat"></div>
      <div class="chat-input">
        <input id="dvChatInput" placeholder="Responder…" maxlength="180">
        <button id="dvChatSend">ENVIAR</button>
      </div>
      <button class="stop" id="dvStop">⏹ PARAR COMPARTILHAMENTO</button>
    </div>
  </div>
</div>
<div id="toastWrap"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function toast(msg, type=''){
  const t = document.createElement('div'); t.className = 'toast '+type; t.textContent = msg;
  $('toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity=0;
    t.style.transform='translateY(14px)'; setTimeout(()=>t.remove(),300); }, 3400);
}

const PEER_PREFIX = 'sentinela7-v2-';
let peer = null, conn = null, watchId = null;
let sent = 0, lastSentAt = 0, chat = [];

// Código vem do hash: driver.html#ABC123
const hashCode = (location.hash || '').replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'');
if (hashCode.length === 6) $('dvCode').value = hashCode;

const savedName = localStorage.getItem('sentinela7.driverName');
if (savedName) $('dvName').value = savedName;

function checkStart(){
  const code = $('dvCode').value.trim().toUpperCase();
  const name = $('dvName').value.trim();
  const consent = $('dvConsent').checked;
  $('dvStart').disabled = !(code.length === 6 && name.length >= 2 && consent);
}
$('dvCode').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  checkStart();
});
$('dvName').addEventListener('input', checkStart);
$('dvConsent').addEventListener('change', checkStart);
checkStart();

function showChat(){
  const box = $('dvChat');
  if (!chat.length){
    box.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:9px;padding:10px 0">◈ Sem mensagens</div>';
    return;
  }
  box.innerHTML = chat.slice(-30).map(m =>
    `<div class="msg ${m.from==='me'?'me':'them'}">${esc(m.text)}
    <div class="meta">${m.from==='me'?'VOCÊ':'CENTRAL'} · ${fmtTime(m.ts)}</div></div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function start(){
  const code = $('dvCode').value.trim().toUpperCase();
  const name = $('dvName').value.trim();
  localStorage.setItem('sentinela7.driverName', name);

  $('dvActiveCode').textContent = code;
  $('dvActiveName').textContent = name;

  if (!('geolocation' in navigator)){ toast('GPS indisponível','danger'); return; }

  peer = new Peer({debug:0});
  peer.on('open', () => {
    conn = peer.connect(PEER_PREFIX + code, {reliable:true});
    conn.on('open', () => {
      conn.send({type:'hello', name});
      $('formView').classList.add('hidden');
      $('activeView').classList.remove('hidden');
      startGPS();
      showChat();
      toast('Conectado à central', 'ok');
      if ('Notification' in window && Notification.permission === 'granted'){
        new Notification('Sentinela-7 ativo', {body:'Compartilhando localização com a central', tag:'sentinela7', silent:true});
      } else if ('Notification' in window && Notification.permission !== 'denied'){
        Notification.requestPermission();
      }
    });
    conn.on('data', data => {
      if (!data) return;
      if (data.type === 'msg'){
        chat.push({from:'them', text:data.text, ts:Date.now()});
        showChat();
        if (navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
      }
    });
    conn.on('close', () => toast('Conexão com a central perdida','danger'));
  });
  peer.on('error', err => {
    console.warn('[driver peer]', err);
    toast('Erro de conexão: '+err.type,'danger');
  });
}

function startGPS(){
  if (watchId != null) return;
  watchId = navigator.geolocation.watchPosition(
    pos => {
      const {latitude:lat, longitude:lng, speed, heading} = pos.coords;
      const now = Date.now();
      if (now - lastSentAt < 4000) return;
      lastSentAt = now; sent++;
      $('dvCount').textContent = sent;
      $('dvLast').textContent = lat.toFixed(5)+', '+lng.toFixed(5);
      try{
        if (conn && conn.open) conn.send({
          type:'pos', lat, lng,
          speed: speed != null ? speed * 3.6 : 0,
          heading: heading || 0, ts: now
        });
      }catch(e){}
    },
    err => console.warn('[gps]', err),
    {enableHighAccuracy:true, maximumAge:3000, timeout:15000}
  );
}

function stop(){
  if (watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  try{ if (conn) conn.close(); }catch(e){}
  try{ if (peer) peer.destroy(); }catch(e){}
  $('activeView').classList.add('hidden');
  $('formView').classList.remove('hidden');
  toast('Compartilhamento encerrado', 'ok');
}

$('dvStart').onclick = start;
$('dvStop').onclick = stop;
$('dvChatSend').onclick = () => {
  const inp = $('dvChatInput'); const text = inp.value.trim();
  if (!text) return;
  chat.push({from:'me', text, ts:Date.now()});
  try{ if (conn && conn.open) conn.send({type:'msg', text}); }catch(e){}
  inp.value = ''; showChat();
};
$('dvChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('dvChatSend').click(); });
</script>
</body>
</html>
