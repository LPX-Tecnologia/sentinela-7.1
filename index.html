<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Sentinela-7 · Central</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--neon:#00f0ff;--gold:#ffb300;--bg:#02060b;--danger:#ff2d55;--ok:#00ff9d;
--line:rgba(0,240,255,.22);--text:#dffcff;--muted:rgba(0,240,255,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 15% 0%,rgba(0,240,255,.1),transparent 45%),
radial-gradient(circle at 90% 100%,rgba(255,179,0,.1),transparent 45%),var(--bg);
color:var(--text);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
min-height:100vh;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px);
opacity:.35}
.app{position:relative;z-index:1;height:100vh;display:grid;
grid-template-columns:320px 1fr 340px;grid-template-rows:auto 1fr auto;
grid-template-areas:"hdr hdr hdr" "side map alerts" "side foot alerts"}
@media(max-width:1000px){.app{grid-template-columns:1fr;
grid-template-areas:"hdr" "map" "side" "alerts" "foot";overflow-y:auto;height:auto}}

header{grid-area:hdr;display:flex;align-items:center;gap:12px;
border-bottom:1px solid var(--line);padding:10px 14px;
background:linear-gradient(90deg,rgba(0,240,255,.06),transparent);flex-wrap:wrap}
header .logo{width:34px;height:34px;flex:0 0 34px;color:var(--neon);
filter:drop-shadow(0 0 6px var(--neon))}
header h1{font-size:14px;letter-spacing:.2em;font-weight:800;
text-shadow:0 0 8px var(--neon)}
header h1 span{color:var(--gold);text-shadow:0 0 8px var(--gold)}
header .spacer{flex:1}
header .hbtn{padding:7px 12px;font-family:inherit;font-size:9.5px;
letter-spacing:.14em;border:1px solid var(--ok);color:var(--ok);
background:rgba(0,255,157,.08);cursor:pointer;white-space:nowrap}
header .hbtn:hover{background:rgba(0,255,157,.2)}
header .code{font-size:11px;letter-spacing:.28em;color:var(--ok);
padding:5px 10px;border:1px solid var(--ok);background:rgba(0,255,157,.06);
font-weight:700}

.side{grid-area:side;border-right:1px solid var(--line);display:flex;
flex-direction:column;overflow:hidden;background:rgba(0,240,255,.02)}
.side-head{padding:10px 12px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:10px;color:var(--gold);letter-spacing:.22em;
margin-bottom:8px;display:flex;justify-content:space-between}
.side-head .count{color:var(--muted);font-size:9px}
.driver-list{flex:1;overflow-y:auto;padding:6px 8px}
.driver-list::-webkit-scrollbar{width:5px}
.driver-list::-webkit-scrollbar-thumb{background:rgba(0,240,255,.3)}
.d-item{border:1px solid rgba(0,240,255,.15);border-left:3px solid var(--ok);
background:rgba(0,255,157,.03);padding:10px;margin-bottom:6px;cursor:pointer;
transition:.18s}
.d-item:hover{background:rgba(0,240,255,.06)}
.d-item.offline{border-left-color:rgba(150,150,150,.5);
background:rgba(120,120,120,.03);opacity:.7}
.d-item .r1{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.d-item .name{font-size:11px;color:#fff;font-weight:700;display:flex;gap:5px;
align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-item .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
box-shadow:0 0 8px var(--ok);flex:0 0 7px}
.d-item.offline .dot{background:rgba(150,150,150,.7);box-shadow:none}
.d-item .r2{font-size:8.5px;color:var(--muted);display:flex;gap:8px;
flex-wrap:wrap;margin-top:3px}
.d-item .r2 b{color:var(--text)}
.empty{text-align:center;padding:22px 10px;font-size:9px;color:var(--muted);
line-height:1.8}

.map-wrap{grid-area:map;position:relative;background:#02060b;min-height:400px}
#map{position:absolute;inset:0}
.map-wrap .scanline{position:absolute;left:0;right:0;height:100px;top:0;
pointer-events:none;z-index:400;
background:linear-gradient(180deg,transparent,rgba(0,240,255,.08),transparent);
animation:scan 7s linear infinite}
@keyframes scan{from{top:-100px}to{top:100%}}
.leaflet-container{background:#02060b!important;font-family:inherit!important}
.leaflet-tile-pane{filter:brightness(.75) saturate(1.05) contrast(1.05)
hue-rotate(-8deg)}
.leaflet-control-attribution{background:rgba(2,6,11,.75)!important;
color:rgba(0,240,255,.5)!important;font-size:8px!important}
.mk-v{width:20px;height:20px;border-radius:50%;background:var(--ok);
box-shadow:0 0 14px var(--ok),0 0 30px rgba(0,255,157,.5);
border:2px solid #fff;position:relative}
.mk-v.offline{background:rgba(150,150,150,.8);box-shadow:none;
border-color:rgba(255,255,255,.5)}
.mk-v span{position:absolute;left:24px;top:-4px;font-size:9.5px;color:#fff;
white-space:nowrap;text-shadow:0 0 6px #000,0 0 10px var(--neon);
background:rgba(2,6,11,.7);padding:2px 6px;border-left:2px solid var(--neon)}
.mk-v .arrow{position:absolute;left:50%;top:50%;width:0;height:0;
border-left:6px solid transparent;border-right:6px solid transparent;
border-bottom:14px solid var(--neon);transform-origin:50% 90%;
transform:translate(-50%,-110%);filter:drop-shadow(0 0 6px var(--neon))}

.alerts{grid-area:alerts;border-left:1px solid var(--line);display:flex;
flex-direction:column;overflow:hidden;background:rgba(255,179,0,.02)}
.alerts-head{padding:10px 12px;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center}
.alerts-head h2{font-size:10px;color:var(--gold);letter-spacing:.22em}
.alerts-head .badge{font-size:9px;padding:2px 8px;border:1px solid var(--ok);
color:var(--ok);background:rgba(0,255,157,.08)}
.alert-list{flex:1;overflow-y:auto;padding:6px 8px}
.alert-list::-webkit-scrollbar{width:5px}
.alert-list::-webkit-scrollbar-thumb{background:rgba(255,179,0,.3)}
.a-item{border:1px solid rgba(0,240,255,.25);border-left:3px solid var(--neon);
background:rgba(0,240,255,.04);padding:8px 10px;margin-bottom:5px;font-size:9px}
.a-item.warn{border-color:rgba(255,179,0,.3);border-left-color:var(--gold);
background:rgba(255,179,0,.04)}
.a-item.danger{border-color:rgba(255,45,85,.3);border-left-color:var(--danger);
background:rgba(255,45,85,.05)}
.a-item .t{font-size:10px;color:#fff;font-weight:700;margin-bottom:2px}
.a-item .d{color:rgba(223,252,255,.7);line-height:1.5}
.a-item .time{color:var(--muted);font-size:8px;margin-top:4px}

footer{grid-area:foot;border-top:1px solid var(--line);padding:7px 12px;
display:flex;gap:12px;align-items:center;font-size:8.5px;color:var(--muted);
flex-wrap:wrap;background:rgba(0,240,255,.02)}
footer b{color:var(--gold);font-size:9.5px}
footer .spacer{flex:1}
footer .legal{color:rgba(0,240,255,.4);font-size:8px}

.modal{position:fixed;inset:0;z-index:9990;display:none;align-items:center;
justify-content:center;background:rgba(2,6,11,.85);backdrop-filter:blur(5px);
padding:16px;overflow-y:auto}
.modal.show{display:flex}
.mcard{width:min(560px,100%);max-height:92vh;overflow-y:auto;
border:1px solid var(--neon);
background:linear-gradient(180deg,rgba(0,240,255,.07),rgba(2,6,11,.98));
padding:20px;margin:auto}
.mcard .hdr{display:flex;justify-content:space-between;align-items:flex-start;
margin-bottom:14px;gap:10px}
.mcard h2{font-size:14px;color:#fff}
.mcard .sub{font-size:9px;color:var(--gold);margin-top:3px;letter-spacing:.14em}
.mcard .close{background:none;border:1px solid var(--line);color:var(--muted);
width:28px;height:28px;cursor:pointer;font-family:inherit}
.mcard .close:hover{border-color:var(--danger);color:var(--danger)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kv .box{border:1px solid var(--line);padding:8px 10px;background:rgba(0,240,255,.03)}
.kv .box .l{font-size:8px;color:var(--muted);letter-spacing:.18em;margin-bottom:3px}
.kv .box .v{font-size:11.5px;color:#fff;font-weight:700}
.kv .box .v.gold{color:var(--gold)}
.kv .box .v.ok{color:var(--ok)}
.chat{max-height:200px;overflow-y:auto;border:1px solid var(--line);padding:8px;
background:rgba(0,0,0,.25);font-size:10px;line-height:1.5;margin-bottom:8px}
.chat .msg{margin-bottom:6px;padding:6px 9px;max-width:85%;word-break:break-word}
.chat .msg.me{background:rgba(0,240,255,.1);border-left:2px solid var(--neon);
margin-left:auto;text-align:right}
.chat .msg.them{background:rgba(255,179,0,.08);border-left:2px solid var(--gold)}
.chat .msg .meta{font-size:7.5px;color:var(--muted);margin-top:2px}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;padding:9px;font-family:inherit;font-size:10px;
background:rgba(0,240,255,.05);border:1px solid var(--line);color:var(--text);
outline:none}
.chat-input button{padding:9px 14px;font-family:inherit;font-size:9.5px;
border:1px solid var(--neon);background:rgba(0,240,255,.1);color:var(--neon);
cursor:pointer}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.actions button{flex:1;min-width:100px;padding:9px;font-family:inherit;
font-size:9.5px;border:1px solid var(--line);background:transparent;
color:var(--muted);cursor:pointer}
.actions button.ok{border-color:var(--ok);color:var(--ok);
background:rgba(0,255,157,.08)}

#toastWrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
z-index:9995;display:flex;flex-direction:column;gap:6px;align-items:center;
pointer-events:none;width:min(92vw,420px)}
.toast{width:100%;padding:9px 12px;border:1px solid var(--gold);
background:rgba(2,6,11,.96);font-size:10px;color:#ffe6b3;backdrop-filter:blur(6px)}
.toast.ok{border-color:var(--ok);color:#c9ffe7}
.toast.danger{border-color:var(--danger);color:#ffd0dc}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.4">
      <path d="M50 7C24 7 12 29 12 48c0 24 17 45 38 45s38-21 38-45C88 29 76 7 50 7Z"/>
      <ellipse cx="33" cy="47" rx="11" ry="7.5" transform="rotate(-22 33 47)" fill="currentColor"/>
      <ellipse cx="67" cy="47" rx="11" ry="7.5" transform="rotate(22 67 47)" fill="currentColor"/>
    </svg>
    <h1>SENTINELA<span>-7</span></h1>
    <div class="spacer"></div>
    <div class="code" id="panelCode">— — — — — —</div>
    <button class="hbtn" id="btnShare">📤 COMPARTILHAR APP DO MOTORISTA</button>
  </header>

  <aside class="side">
    <div class="side-head">
      <h2>◈ MOTORISTAS <span class="count" id="driverCount">0</span></h2>
    </div>
    <div class="driver-list" id="driverList"></div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="scanline"></div>
  </main>

  <aside class="alerts">
    <div class="alerts-head">
      <h2>◈ ALERTAS</h2>
      <span class="badge" id="alertBadge">0</span>
    </div>
    <div class="alert-list" id="alertList"></div>
  </aside>

  <footer>
    <div>ONLINE <b id="fOnline">0</b></div>
    <div>MOVENDO <b id="fMoving">0</b></div>
    <div class="spacer"></div>
    <div class="legal">LGPD · CONSENTIMENTO REGISTRADO · © SENTINELA-7</div>
  </footer>
</div>

<div class="modal" id="detailModal">
  <div class="mcard">
    <div class="hdr">
      <div><h2 id="dName">—</h2><div class="sub" id="dCode">—</div></div>
      <button class="close" id="dClose">✕</button>
    </div>
    <div class="kv">
      <div class="box"><div class="l">STATUS</div><div class="v ok" id="dStatus">—</div></div>
      <div class="box"><div class="l">VELOCIDADE</div><div class="v" id="dSpeed">—</div></div>
      <div class="box"><div class="l">POSIÇÃO</div><div class="v gold" id="dPos">—</div></div>
      <div class="box"><div class="l">ATUALIZADO</div><div class="v" id="dLast">—</div></div>
    </div>
    <div class="actions">
      <button class="ok" id="dCenter">🎯 CENTRALIZAR</button>
    </div>
    <div style="font-size:10px;color:var(--gold);letter-spacing:.16em;margin-bottom:8px">◈ CANAL COM O MOTORISTA</div>
    <div class="chat" id="dChat"></div>
    <div class="chat-input">
      <input id="dChatInput" placeholder="Escreva para o motorista…" maxlength="180">
      <button id="dChatSend">ENVIAR</button>
    </div>
  </div>
</div>

<div id="toastWrap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const since = ts => { const s=Math.round((Date.now()-ts)/1000); return s<60?s+'s':s<3600?Math.round(s/60)+'min':Math.round(s/3600)+'h'; };

function toast(msg, type=''){
  const t = document.createElement('div'); t.className = 'toast '+type; t.textContent = msg;
  $('toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity=0;
    t.style.transform='translateY(14px)'; setTimeout(()=>t.remove(),300); }, 3400);
}

const PEER_PREFIX = 'sentinela7-v2-';
let sessionCode = localStorage.getItem('sentinela7.sessionCode');
if (!sessionCode){
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  sessionCode = '';
  for (let i=0;i<6;i++) sessionCode += L[Math.floor(Math.random()*L.length)];
  localStorage.setItem('sentinela7.sessionCode', sessionCode);
}
$('panelCode').textContent = sessionCode.split('').join(' ');

const drivers = {};
let map, hostPeer = null, selectedId = null;

function initMap(){
  map = L.map('map',{zoomControl:true,preferCanvas:true,worldCopyJump:true})
    .setView([-23.5613,-46.6565], 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {maxZoom:20,subdomains:'abcd',attribution:'&copy; OSM &copy; CARTO'}).addTo(map);
}

function pushAlert(level, title, body){
  const list = $('alertList');
  const item = document.createElement('div');
  item.className = 'a-item ' + (level || '');
  item.innerHTML = `<div class="t">${level==='danger'?'🚨':level==='warn'?'⚠':'ℹ'} ${esc(title)}</div>
    <div class="d">${esc(body)}</div><div class="time">${fmtTime(Date.now())}</div>`;
  list.insertBefore(item, list.firstChild);
  $('alertBadge').textContent = list.children.length;
}

function driverIcon(d){
  return L.divIcon({className:'',
    html:`<div class="mk-v ${d.online?'':'offline'}">
      <div class="arrow" style="transform:translate(-50%,-110%) rotate(${d.heading||0}deg)"></div>
      <span>${esc(d.name)} · ${Math.round(d.speed||0)} km/h</span>
    </div>`, iconSize:[20,20],iconAnchor:[10,10]});
}

function renderList(){
  const list = $('driverList');
  const keys = Object.keys(drivers);
  $('driverCount').textContent = keys.length;
  if (!keys.length){
    list.innerHTML = '<div class="empty">NENHUM MOTORISTA<br><br>Toque em<br><b>COMPARTILHAR APP</b><br>e envie o link.</div>';
    return;
  }
  list.innerHTML = keys.sort((a,b) => (drivers[b].online?1:0)-(drivers[a].online?1:0)).map(k => {
    const d = drivers[k];
    const st = d.online ? (d.speed > 3 ? Math.round(d.speed)+' km/h' : 'parado') : 'offline';
    return `<div class="d-item ${d.online?'':'offline'}" data-id="${k}">
      <div class="r1"><div class="name"><span class="dot"></span>${esc(d.name)}</div></div>
      <div class="r2"><span>◈ <b>${st}</b></span>
      <span>◈ ${d.online?'há '+since(d.ts):'sem sinal'}</span></div></div>`;
  }).join('');
  list.querySelectorAll('.d-item').forEach(el => {
    el.onclick = () => openDetail(el.dataset.id);
  });
}

function renderMarkers(){
  Object.keys(drivers).forEach(k => {
    const d = drivers[k];
    if (d.lat == null) return;
    const ll = [d.lat, d.lng];
    if (!d.marker){
      d.marker = L.marker(ll,{icon:driverIcon(d),zIndexOffset:500}).addTo(map);
      d.marker.on('click', () => openDetail(k));
    } else {
      d.marker.setLatLng(ll);
      d.marker.setIcon(driverIcon(d));
    }
  });
}

function updateStats(){
  const arr = Object.values(drivers);
  $('fOnline').textContent = arr.filter(d => d.online).length;
  $('fMoving').textContent = arr.filter(d => d.online && d.speed > 3).length;
}

function openDetail(id){
  selectedId = id;
  const d = drivers[id];
  if (!d) return;
  $('dName').textContent = d.name;
  $('dCode').textContent = 'PEER · ' + id.slice(-8).toUpperCase();
  $('dStatus').textContent = d.online ? 'ONLINE' : 'OFFLINE';
  $('dStatus').className = 'v ' + (d.online ? 'ok' : '');
  $('dSpeed').textContent = d.speed != null ? Math.round(d.speed)+' km/h' : '—';
  $('dPos').textContent = d.lat != null ? d.lat.toFixed(5)+', '+d.lng.toFixed(5) : '—';
  $('dLast').textContent = d.ts ? 'há '+since(d.ts) : '—';
  renderChat(id);
  $('detailModal').classList.add('show');
}

function renderChat(id){
  const d = drivers[id]; if (!d) return;
  const box = $('dChat');
  if (!d.chat.length){
    box.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:9px;padding:12px 0">◈ Sem mensagens ainda</div>';
    return;
  }
  box.innerHTML = d.chat.slice(-40).map(m =>
    `<div class="msg ${m.from==='me'?'me':'them'}">${esc(m.text)}
    <div class="meta">${m.from==='me'?'CENTRAL':'MOTORISTA'} · ${fmtTime(m.ts)}</div></div>`).join('');
  box.scrollTop = box.scrollHeight;
}

$('dClose').onclick = () => { $('detailModal').classList.remove('show'); selectedId = null; };
$('dCenter').onclick = () => {
  const d = drivers[selectedId]; if (!d || d.lat == null) return;
  map.setView([d.lat, d.lng], Math.max(map.getZoom(), 16), {animate:true});
  $('detailModal').classList.remove('show');
};
$('dChatSend').onclick = () => {
  const inp = $('dChatInput'); const text = inp.value.trim();
  if (!text || !selectedId) return;
  const d = drivers[selectedId];
  d.chat.push({from:'me', text, ts:Date.now()});
  try{ if (d.conn && d.conn.open) d.conn.send({type:'msg', text}); }catch(e){}
  inp.value = ''; renderChat(selectedId);
  toast('Mensagem enviada', 'ok');
};
$('dChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('dChatSend').click(); });

$('btnShare').onclick = async () => {
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  const url = base + 'driver.html#' + sessionCode;
  const msg = `Sentinela-7 — App do Motorista\n\n1) Abra este link no celular\n2) Autorize o compartilhamento de localização\n3) Mantenha o app aberto durante o serviço\n\n${url}`;
  if (navigator.share){
    try{ await navigator.share({title:'Sentinela-7 Motorista', text:msg, url}); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(url); toast('Link copiado!','ok'); }
  catch(e){ prompt('Copie o link:', url); }
};

function startHost(){
  hostPeer = new Peer(PEER_PREFIX + sessionCode, {debug:0});

  hostPeer.on('open', () => {
    toast('Central online · aguardando motoristas', 'ok');
    pushAlert('info', 'Central iniciada', 'Código: ' + sessionCode);
  });

  hostPeer.on('connection', conn => {
    const d = {
      name: 'Motorista', lat: null, lng: null, speed: 0, heading: 0,
      ts: Date.now(), online: true, conn, chat: [], marker: null, _new: true
    };
    drivers[conn.peer] = d;

    conn.on('data', data => {
      if (!data) return;
      if (data.type === 'hello'){
        d.name = (data.name || 'Motorista').slice(0,24);
        if (d._new){ pushAlert('info', 'Motorista conectado', d.name); d._new = false; }
        renderList();
      }
      if (data.type === 'pos'){
        d.lat = data.lat; d.lng = data.lng;
        d.speed = data.speed || 0; d.heading = data.heading || 0;
        d.ts = Date.now(); d.online = true;
        renderList(); renderMarkers(); updateStats();
        if (selectedId === conn.peer) openDetail(conn.peer);
      }
      if (data.type === 'msg'){
        d.chat.push({from:'them', text:data.text, ts:Date.now()});
        if (selectedId === conn.peer) renderChat(conn.peer);
        pushAlert('warn', 'Mensagem de ' + d.name, data.text);
      }
    });

    conn.on('close', () => {
      d.online = false;
      renderList(); renderMarkers(); updateStats();
      pushAlert('warn', 'Motorista desconectou', d.name);
    });
    conn.on('error', () => { d.online = false; renderList(); });
  });

  hostPeer.on('error', err => {
    console.warn('[peer]', err);
    if (err.type === 'unavailable-id'){ toast('Código em uso, gerando novo…','danger');
      localStorage.removeItem('sentinela7.sessionCode'); setTimeout(()=>location.reload(), 1500); }
  });
  hostPeer.on('disconnected', () => { try{ hostPeer.reconnect(); }catch(e){} });
}

initMap();
startHost();
renderList();
updateStats();
setTimeout(() => map.invalidateSize(), 200);
</script>
</body>
</html>
